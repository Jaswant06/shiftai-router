[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftai-router"
version = "0.1.0.dev0"
description = "ShiftAI: adaptive LLM routing for resource-efficient local AI. Sends each prompt to the smallest local model that can answer it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaswant Singh" }]
keywords = [
    "llm", "llm-router", "ollama", "local-llm", "model-routing",
    "inference-optimization", "energy-efficiency", "on-device-ai",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Building the profiling dataset, training the router, plotting results.
bench = [
    "datasets>=3.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
shiftai = "shiftai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shiftai = ["artifacts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
